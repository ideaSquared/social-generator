# Runs the generator on a timer and serves the review page. See docs/automate.md.
#   cd deploy && cp .env.example .env   (fill it in)   &&   docker compose up -d --build
services:
  runner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      GOOGLE_CREDENTIALS: /run/secrets/service-account.json
    command: ["python", "automate.py", "--out", "/data", "--every", "${CHECK_EVERY_MINUTES:-60}"]
    volumes:
      - social-out:/data
      - ./secrets:/run/secrets:ro
    mem_limit: 2g
    cpus: 2

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${REVIEW_PORT:-8087}:80"
    volumes:
      - social-out:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  social-out:
