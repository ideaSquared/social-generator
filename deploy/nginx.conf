# Serves the output folder: the review page at /, the per-platform files under /posts/.
# These are unpublished drafts. Keep this on your own network, or put a login in front of it.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    autoindex on;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    location ~ /\. { deny all; }           # .state.json, .html working files
    location = /posts.csv { deny all; }    # the raw sheet export
}
