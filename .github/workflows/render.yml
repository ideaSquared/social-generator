name: Render social assets
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Asset IDs to render, comma-separated (blank = all)"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji
          pip install pillow
      - name: Download the sheet
        run: curl -sSL --fail "$SHEET_CSV_URL" -o posts.csv
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
      - name: Check the sheet
        run: python checks/claims_check.py posts.csv
      - name: Render
        env:
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            python render.py posts.csv --out out --only "$ONLY"
          else
            python render.py posts.csv --out out --new-only
          fi
      - name: Check, post-process and build the review page
        run: |
          if [ -f out/manifest.json ]; then
            python checks/visual_check.py out
            python postprocess.py all out
            python gallery.py out --csv posts.csv
          fi
          python package.py out --csv posts.csv
      - uses: actions/upload-artifact@v4
        with:
          name: social-assets
          path: |
            out
            !out/.html
