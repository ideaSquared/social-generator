<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixture creator page</title>
<style>
:root{color-scheme:light dark;--bg:#f8fafc;--tx:#0f172a;--mut:#64748b}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--tx:#f1f5f9;--mut:#94a3b8}}
*{box-sizing:border-box;margin:0}body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:28px 20px}
header{display:flex;align-items:center;gap:16px;margin-bottom:24px}.av{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#ec4899)}
h1{font-size:24px}p{color:var(--mut);font-size:14px;margin-top:2px}
.g{columns:2;column-gap:12px}.g div{break-inside:avoid;margin-bottom:12px;border-radius:16px}
@media (min-width:700px){body{padding:48px 120px}.g{columns:4;column-gap:20px}.g div{margin-bottom:20px}}
</style></head><body>
<header><div class="av"></div><div><h1>Demo Creator</h1><p>Fixture page for tests</p></div></header>
<div class="g">
<div style="height:220px;background:#7c3aed"></div><div style="height:120px;background:#ec4899"></div><div style="height:160px;background:#0ea5e9"></div>
<div style="height:260px;background:#f59e0b"></div><div style="height:140px;background:#10b981"></div><div style="height:200px;background:#6d28d9"></div>
<div style="height:180px;background:#ef4444"></div><div style="height:240px;background:#14b8a6"></div><div style="height:130px;background:#8b5cf6"></div>
<div style="height:210px;background:#f472b6"></div><div style="height:170px;background:#3b82f6"></div><div style="height:250px;background:#84cc16"></div>
</div></body></html>
